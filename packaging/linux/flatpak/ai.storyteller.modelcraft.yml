# Flatpak manifest for ModelCraft, ready for a Flathub submission.
#
# Flatpak builds run offline, so the crate sources must be vendored first. From the repo root:
#
#   curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
#   python3 flatpak-cargo-generator.py Cargo.lock -o packaging/linux/flatpak/cargo-sources.json
#   flatpak-builder --user --install --force-clean build-flatpak packaging/linux/flatpak/ai.storyteller.modelcraft.yml
#   flatpak run ai.storyteller.modelcraft
#
# For Flathub, replace the `dir` source with a `git` source pinned to a release tag and commit.
# The release's .flatpak bundles are built from ai.storyteller.modelcraft.bundle.yml instead (it
# repackages the Linux tarball); keep runtime-version and finish-args identical in both.
id: ai.storyteller.modelcraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: modelcraft
finish-args:
  # The shared updater inspects and updates this installation via flatpak-spawn --host.
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=xdg-data/ArtCraft/versions:ro
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Open/Save dialogs go through the file-chooser portal (rfd) and drag-and-drop through the
  # document portal, so picked files work anywhere without broad filesystem access. Documents is
  # granted so scenes and models passed by path (the command line, Open Recent) work in the usual place.
  - --filesystem=xdg-documents
  # Network: update checks reach GitHub. The control channel is stdin/stdout only (modelcraft-cli
  # control). Home/host filesystem access is deliberately not granted.
  - --share=network
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: modelcraft
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/modelcraft/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked -p modelcraft
      - install -Dm755 target/release/modelcraft /app/bin/modelcraft
      - install -Dm644 NOTICE /app/share/doc/modelcraft/NOTICE
      - install -Dm644 packaging/linux/ai.storyteller.modelcraft.desktop /app/share/applications/ai.storyteller.modelcraft.desktop
      - install -Dm644 packaging/linux/ai.storyteller.modelcraft.mime.xml /app/share/mime/packages/ai.storyteller.modelcraft.xml
      - mkdir -p /app/share/icons && cp -R assets/app-icon/hicolor /app/share/icons/
      - >-
        version=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml);
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/"
        packaging/linux/ai.storyteller.modelcraft.metainfo.xml.in > /app/share/metainfo/ai.storyteller.modelcraft.metainfo.xml
    sources:
      - type: dir
        path: ../../..
        skip:
          - target
          - dist
          - corpus
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
