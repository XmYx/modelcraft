[package]
name = "modelcraft-cli"
description = "ModelCraft command line: build, convert, inspect and benchmark models without the window"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "modelcraft-cli"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Hardware ray queries in the GPU path tracer (see crates/craft-render-gpu/src/hw.rs); off by default.
hw-ray-query = ["modelcraft-render/hw-ray-query"]

[dependencies]
modelcraft-engine = { workspace = true }
modelcraft-script = { workspace = true }
modelcraft-scene = { workspace = true }
modelcraft-ops = { workspace = true }
modelcraft-sculpt = { workspace = true }
modelcraft-formats = { workspace = true }
modelcraft-mesh = { workspace = true }
modelcraft-hair = { workspace = true }
modelcraft-sim = { workspace = true }
glam = { workspace = true }
serde_json = { workspace = true }
craft-control = { workspace = true }
craft-mcp-server = { workspace = true }
modelcraft-render = { workspace = true }
modelcraft-bake = { workspace = true }
craft-atomic = { workspace = true }
wgpu = { workspace = true }
craft-image-codecs = { workspace = true }
craft-exr = { workspace = true }
