[package]
name = "modelcraft-render"
description = "ModelCraft viewport renderer: cameras, picking and the wgpu draw path, with a CPU path for machines without a GPU"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Hardware ray queries in the GPU path tracer (one documented `unsafe` call; off by default).
hw-ray-query = ["craft-render-gpu/hw-ray-query"]

[dependencies]
rayon = { workspace = true }
modelcraft-mesh = { workspace = true }
modelcraft-scene = { workspace = true }
modelcraft-hair = { workspace = true }
craft-render-core = { workspace = true }
craft-render-gpu = { workspace = true }
craft-mcmat = { workspace = true }
craft-hdr = { workspace = true }
craft-image-codecs = { workspace = true }
craft-exr = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }
wgpu = { workspace = true }
log = { workspace = true }
pollster = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
modelcraft-sim = { workspace = true }
modelcraft-ops = { workspace = true }
