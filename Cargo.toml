[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/modelcraft"

[workspace.dependencies]
# internal
modelcraft-anim = { path = "crates/anim" }
modelcraft-sim = { path = "crates/sim" }
modelcraft-mesh = { path = "crates/mesh" }
modelcraft-ops = { path = "crates/ops" }
modelcraft-field = { path = "crates/field" }
modelcraft-clone = { path = "crates/clone" }
modelcraft-scene = { path = "crates/scene" }
modelcraft-sculpt = { path = "crates/sculpt" }
modelcraft-formats = { path = "crates/formats" }
modelcraft-engine = { path = "crates/engine" }
modelcraft-render = { path = "crates/render" }
modelcraft-script = { path = "crates/script" }
craft-render-bvh = { path = "crates/craft-render-bvh" }
craft-render-core = { path = "crates/craft-render-core" }
craft-gltf-anim = { path = "crates/craft-gltf-anim" }
craft-render-gpu = { path = "crates/craft-render-gpu" }
craft-render-denoise = { path = "crates/craft-render-denoise" }
craft-render-guide = { path = "crates/craft-render-guide" }
modelcraft-uv = { path = "crates/uv" }
modelcraft-uvpack = { path = "crates/uvpack" }
modelcraft-hair = { path = "crates/hair" }

# shared Craft libraries (storytold/craft-libs), pinned by commit like the other Craft apps
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "0649a07aa11834fa5bd7052c8b97a861db532a22", version = "=0.1.0" }
craft-mesh = { git = "https://github.com/storytold/craft-libs", rev = "0649a07aa11834fa5bd7052c8b97a861db532a22", version = "=0.1.0", default-features = false, features = ["obj", "gltf", "stl", "ply", "fbx", "threemf"] }
craft-texture = { git = "https://github.com/storytold/craft-libs", rev = "0649a07aa11834fa5bd7052c8b97a861db532a22", version = "=0.1.0" }
craft-mcmat = { git = "https://github.com/storytold/craft-libs", rev = "0649a07aa11834fa5bd7052c8b97a861db532a22", version = "=0.1.0" }
craft-hdr = { git = "https://github.com/storytold/craft-libs", rev = "0649a07aa11834fa5bd7052c8b97a861db532a22", version = "=0.1.0" }
craft-exr = { git = "https://github.com/storytold/craft-libs", rev = "0649a07aa11834fa5bd7052c8b97a861db532a22", version = "=0.1.0", features = ["decode"] }
craft-zip = { git = "https://github.com/storytold/craft-libs", rev = "0649a07aa11834fa5bd7052c8b97a861db532a22", version = "=0.1.0" }
craft-image-codecs = { git = "https://github.com/storytold/craft-libs", rev = "0649a07aa11834fa5bd7052c8b97a861db532a22", version = "=0.1.0" }
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "0649a07aa11834fa5bd7052c8b97a861db532a22", version = "=0.1.0" }
craft-keymap = { git = "https://github.com/storytold/craft-libs", rev = "0649a07aa11834fa5bd7052c8b97a861db532a22", version = "=0.1.0" }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "0649a07aa11834fa5bd7052c8b97a861db532a22", version = "=0.1.0" }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "0649a07aa11834fa5bd7052c8b97a861db532a22", version = "=0.1.0" }
craft-control = { git = "https://github.com/storytold/craft-libs", rev = "0649a07aa11834fa5bd7052c8b97a861db532a22", version = "=0.1.0" }
craft-mcp-server = { git = "https://github.com/storytold/craft-libs", rev = "0649a07aa11834fa5bd7052c8b97a861db532a22", version = "=0.1.0" }
craft-fonts-build = { git = "https://github.com/storytold/craft-libs", rev = "0649a07aa11834fa5bd7052c8b97a861db532a22", version = "=0.1.0" }

# physics (Apache-2.0): rigid bodies and joints
rapier3d = { version = "0.36", default-features = false, features = ["dim3", "f32", "std", "enhanced-determinism"] }

# foundation
rhai = { version = "1.27", default-features = false, features = ["std", "serde", "metadata"] }
glam = { version = "0.30", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
proptest = "1"
bytemuck = { version = "1", features = ["derive"] }
rayon = "1.10"

# gpu (the same wgpu major as egui-wgpu in the suite's egui fork)
wgpu = { version = "30", default-features = false, features = ["wgsl", "vulkan", "metal", "dx12", "gles"] }
pollster = "0.4"

# ui
egui = "0.37"
eframe = { version = "0.37", default-features = false }
egui-wgpu = "0.37"
egui_kittest = "0.37"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# Mesh kernels are hot even in debug runs of the app.
[profile.dev.package.modelcraft-mesh]
opt-level = 3
[profile.dev.package.modelcraft-ops]
opt-level = 3
[profile.dev.package.modelcraft-uv]
opt-level = 3
[profile.dev.package.modelcraft-uvpack]
opt-level = 3
[profile.dev.package.modelcraft-sculpt]
opt-level = 3
# So is ray tracing.
[profile.dev.package.craft-render-bvh]
opt-level = 3
[profile.dev.package.craft-render-core]
opt-level = 3
[profile.dev.package.craft-render-denoise]
opt-level = 3
[profile.dev.package.craft-render-guide]
opt-level = 3

# The Craft apps build against the suite's egui and winit forks (same revisions as craft-libs).
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
