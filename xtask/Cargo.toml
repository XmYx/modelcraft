[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde_json = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std"] }
# `cargo xtask icons`: render the app icon SVG (craft-svg's bounded resvg renderer) and encode PNGs.
craft-svg = { git = "https://github.com/storytold/craft-libs", rev = "0649a07aa11834fa5bd7052c8b97a861db532a22", version = "=0.1.0", default-features = false, features = ["tree-render"] }
craft-image-codecs = { workspace = true }
